name: Build and deploy Node.js + Angular app to Azure Web App - eyescans-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      # Step 1: Checkout repo
      - uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Step 3: Install backend dependencies and build NestJS
      - name: npm install and build backend
        run: |
          npm install
          npm run build --if-present

      # Step 4: Install Angular dependencies and build frontend
      - name: Build Angular frontend
        working-directory: ./public   # Change if your Angular source is elsewhere
        run: |
          npm install
          npm run build --configuration production

      # Step 5: Upload artifact for deployment
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 6: Download artifact from build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Step 7: Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AF2D6249BA4C47D8B4484160DA7FEA7E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4EC0AC13910D4AD6856781AED854A9F5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3760CF96EF404ED696CFF800A2034418 }}

      # Step 8: Deploy to Azure Web App
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eyescans-api'
          slot-name: 'Production'
          package: .
